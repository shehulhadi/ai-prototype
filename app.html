<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LegisCore AI | Legal Associate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a; --surface: #121212; --surface-2: #1a1a1a;
  --border: rgba(255,255,255,0.08); --text: #ededed; --muted: #888;
  --accent: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3, .brand { font-family: 'Plus Jakarta Sans', sans-serif; }

/* Header & Nav */
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 1.1rem; font-weight: 800; color: #fff; }
.brand span { color: var(--accent); }
.header-actions { display: flex; align-items: center; gap: 12px; }
.btn-update { background: transparent; border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
.status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); }
.dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

/* Main Container */
.container { padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; }
.card h3 { font-size: 1rem; margin-bottom: 12px; color: #fff; }
.card p { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

/* File Drop Zone */
.drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; transition: 0.2s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; }
.drop-zone:hover { border-color: var(--accent); background: var(--accent-glow); }
.drop-icon { font-size: 1.5rem; margin-bottom: 8px; }

/* AI Chat */
.chat-container { display: flex; flex-direction: column; height: 400px; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; padding-right: 5px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; line-height: 1.5; }
.msg.ai { background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.user { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.chat-input { display: flex; gap: 8px; }
.chat-input input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; font-family: inherit; outline: none; font-size: 16px; }
.chat-input input:focus { border-color: var(--accent); }
.chat-input button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-weight: 600; cursor: pointer; }

@media (min-width: 768px) {
  .container { display: grid; grid-template-columns: 300px 1fr; align-items: start; }
  .chat-container { height: 500px; }
}
</style>
</head>
<body>

<header>
  <div class="brand"><span>Legis</span>Core AI</div>
  <div class="header-actions">
    <button onclick="clearAppCache()" class="btn-update">Update App</button>
    <div class="status"><div class="dot"></div> AI Connected</div>
  </div>
</header>

<div class="container">
  <!-- Left: Upload -->
  <div class="card">
    <h3>Document Context</h3>
    <p>Upload a legal document for the AI to analyze.</p>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" hidden>
      <div class="drop-icon" id="dropIcon">📄</div>
      <div id="dropText" style="font-weight: 600; margin-bottom: 4px;">Click to Upload</div>
      <div id="dropSubtext" style="font-size: 0.75rem; color: var(--muted);">Max 50MB</div>
    </div>
  </div>

  <!-- Right: Chat -->
  <div class="card">
    <h3>AI Legal Associate</h3>
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="msg ai">Hello Counselor. I am your LegisCore AI Assistant, connected to Google Gemini. How can I help you today?</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask a legal question..." autocomplete="off">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
// === CLEAR CACHE ===
async function clearAppCache() {
  if ('caches' in window) {
    const keys = await caches.keys();
    for (let k of keys) await caches.delete(k);
  }
  window.location.reload(true);
}

// === DOCUMENT UPLOAD ===
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const dropIcon = document.getElementById('dropIcon');
const dropText = document.getElementById('dropText');
const dropSubtext = document.getElementById('dropSubtext');
let documentUploaded = false;

function simulateUpload(fileName) {
  dropIcon.innerText = '⏳';
  dropText.innerText = 'Analyzing...';
  dropSubtext.innerText = fileName;
  setTimeout(() => {
    dropIcon.innerText = '✅';
    dropText.innerText = 'Document Loaded';
    dropSubtext.innerText = 'Ready for AI review';
    documentUploaded = true;
    addMessage('ai', `I have loaded <b>${fileName}</b>. You can now ask me to summarize it or extract risks.`);
  }, 1500);
}

fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) simulateUpload(e.target.files[0].name); });
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = 'var(--border)'; });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); dropZone.style.borderColor = 'var(--border)';
  if (e.dataTransfer.files.length > 0) simulateUpload(e.dataTransfer.files[0].name);
});

// === REAL AI CHAT ===
const API_URL = 'https://script.google.com/macros/s/AKfycbx1ZzD-ze1IjU2AvDxAyPrwWazL6rqSbPYlJnnKVaQIRe7T_za41yDWF4nzjmn0L3fSsA/exec';
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(sender, text) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${sender}`;
  msgDiv.innerHTML = text;
  chatMessages.appendChild(msgDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function handleSend() {
  const text = chatInput.value.trim();
  if (!text) return;
  
  addMessage('user', text);
  chatInput.value = '';
  
  const typingId = 'typing-' + Date.now();
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai';
  typingDiv.id = typingId;
  typingDiv.innerHTML = '<i>AI is thinking...</i>';
  chatMessages.appendChild(typingDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  
  // Build prompt
  const systemPrompt = "You are LegisCore AI, an expert legal associate for Nigerian law firms. Keep answers professional, concise, and helpful. Use bullet points if listing risks.";
  const docContext = documentUploaded ? "A document has been uploaded. The user may ask about its risks or summary. " : "No document uploaded yet. ";
  const fullPrompt = systemPrompt + docContext + "User says: " + text;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // Bypasses CORS preflight
      body: JSON.stringify({ prompt: fullPrompt })
    });
    
    const data = await response.json();
    document.getElementById(typingId).remove();
    
    if (data.reply) {
      // Format markdown to HTML
      let formatted = data.reply
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.*?)\*/g, '<i>$1</i>')
        .replace(/\n/g, '<br>');
      addMessage('ai', formatted);
    } else {
      addMessage('ai', 'Error: ' + (data.error || 'Could not get response.'));
    }
  } catch (error) {
    document.getElementById(typingId).remove();
    addMessage('ai', 'Network error. Could not reach the AI backend.');
    console.error(error);
  }
}

sendBtn.addEventListener('click', handleSend);
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
</script>
</body>
</html>
